    <!-- Service Worker Registration & Offline Indicator -->
    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
const CACHE_NAME = 'pmbf-cache-v1';
const urlsToCache = [
    '/',
    '/index.html',
    '/manifest.json'
];

self.addEventListener('install', event => {
    event.waitUntil(
        caches.open(CACHE_NAME).then(cache => {
            return cache.addAll(urlsToCache).catch(() => {
                console.log('Cache addAll failed, some resources may be offline');
            });
        })
    );
    self.skipWaiting();
});

self.addEventListener('activate', event => {
    event.waitUntil(
        caches.keys().then(cacheNames => {
            return Promise.all(
                cacheNames.map(cacheName => {
                    if (cacheName !== CACHE_NAME) {
                        return caches.delete(cacheName);
                    }
                })
            );
        })
    );
    self.clients.claim();
});

self.addEventListener('fetch', event => {
    if (event.request.method !== 'GET') {
        return;
    }

    event.respondWith(
        caches.match(event.request).then(response => {
            if (response) {
                return response;
            }

            return fetch(event.request).then(response => {
                if (!response || response.status !== 200 || response.type === 'error') {
                    return response;
                }

                const responseToCache = response.clone();
                caches.open(CACHE_NAME).then(cache => {
                    cache.put(event.request, responseToCache);
                });

                return response;
            }).catch(() => {
                return caches.match('/index.html');
            });
        })
    );
});
            `;

            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);

            navigator.serviceWorker.register(swUrl).then(reg => {
                console.log('✅ Service Worker registered');
            }).catch(err => {
                console.log('❌ Service Worker registration failed:', err);
            });
        }

        // PWA Install Prompt
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            deferredPrompt = e;
        });

        document.addEventListener('DOMContentLoaded', function() {

                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('mainApp').style.display = 'none';
            }
        });
    </script>

    <!-- IMG-LINK-CONVERTER: konvèti foto an lyen (imgbb, catbox si l echwe) pou pa plen espas Firebase -->
    <style>
        .img-link-inline { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .img-link-inline .il-preview { display: none; width: 40px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; }

    <script>
        const ImgLinkConverter = (function () {
            const IMGBB_API_KEY = '808b99f038e8855c6e93a124bd09cc6b';

            const LABELS = {
                convertBtn: '📷 Konvèti Foto',
                badFile: '❌ Chwazi yon foto.',
                tooBig: '❌ Foto twò gwo (maks 10 Mo).',
                converting: '⏳ Ap konvèti...',
                done: '✅ Konvèti!',
                failed: '❌ Pa mache, eseye ankò.',
                batchEmpty: 'Poko gen lyen',
                copied: '📋 Kopye!'
            };

            async function uploadToImgbb(file) {
                const fd = new FormData();
                fd.append('image', file);
                const resp = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(IMGBB_API_KEY), { method: 'POST', body: fd });
                const json = await resp.json();
                if (!resp.ok || !json || !json.success || !json.data) {
                    throw new Error((json && json.error && json.error.message) || ('HTTP ' + resp.status));
                }
                return json.data.display_url || json.data.url;
            }

            async function uploadToCatbox(file) {
                const fd = new FormData();
                fd.append('reqtype', 'fileupload');
                fd.append('fileToUpload', file);
                const resp = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: fd });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const url = (await resp.text()).trim();
                if (!/^https?:\/\//i.test(url)) throw new Error(url || 'echwe');
                return url;
            }

            async function convertImageToLink(file) {
                let url = null;
                if (IMGBB_API_KEY) { try { url = await uploadToImgbb(file); } catch (e) { /* eseye plan B */ } }
                if (!url) { try { url = await uploadToCatbox(file); } catch (e) { /* tou de echwe */ } }
                return url;
            }

            function attachInline(inputId) {
                const input = document.getElementById(inputId);
                if (!input || input.dataset.ilAttached) return;
                input.dataset.ilAttached = '1';

                const wrap = document.createElement('div');
                wrap.className = 'img-link-inline';
                wrap.innerHTML =
                    '<img class="il-preview" id="ilprev_' + inputId + '">' +
                    '<label class="il-btn" for="ilfile_' + inputId + '">' + LABELS.convertBtn + '</label>' +
                    '<input type="file" id="ilfile_' + inputId + '" accept="image/*" style="display:none;">' +
                    '<span class="il-status" id="ilstatus_' + inputId + '"></span>';
                input.insertAdjacentElement('afterend', wrap);

                document.getElementById('ilfile_' + inputId).addEventListener('change', function () {
                    handleInlineUpload(this, inputId);
                });

                if (input.value) {
                    const p = document.getElementById('ilprev_' + inputId);
                    p.src = input.value;
                    p.style.display = 'inline-block';
                }
            }

            async function handleInlineUpload(fileInput, targetInputId) {
                const file = fileInput.files[0];
                if (!file) return;
                const status = document.getElementById('ilstatus_' + targetInputId);
                const preview = document.getElementById('ilprev_' + targetInputId);
                const target = document.getElementById(targetInputId);

                if (!file.type || !file.type.startsWith('image/')) { status.textContent = LABELS.badFile; return; }
                if (file.size > 10 * 1024 * 1024) { status.textContent = LABELS.tooBig; return; }

                status.textContent = LABELS.converting;
                const url = await convertImageToLink(file);

                if (url) {
                    target.value = url;
                    target.dispatchEvent(new Event('input', { bubbles: true }));
                    target.dispatchEvent(new Event('change', { bubbles: true }));
                    preview.src = url;
                    preview.style.display = 'inline-block';
                    status.textContent = LABELS.done;

                    // Auto-copier le lien
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(url).catch(() => {});
                    }

                    setTimeout(() => { if (status) status.textContent = ''; }, 2500);
                } else {
                    status.textContent = LABELS.failed;
                }
                fileInput.value = '';
            }

            return {
                IMGBB_API_KEY,
                LABELS,
                convertImageToLink,
                attachInline
            };
        })();
    </script>

        // Session Management
        function saveSession() {
            localStorage.setItem('pmbf_session', JSON.stringify({
                user: currentUser,
                isAdmin: isAdmin,
                timestamp: new Date().getTime()
            }));
        }

        function restoreSession() {
            const session = localStorage.getItem('pmbf_session');
            if (session) {
                try {
                    const data = JSON.parse(session);
                    currentUser = data.user;
                    isAdmin = data.isAdmin;
                    if (currentUser) {
                        loadData();
                        showMainApp();
                        return true;
                    }
                } catch (e) {
                    console.log('Session invalide');
                }
            }
            return false;
        }

        // Login Functions
        function loginUser() {
            const key = document.getElementById('accessKey').value.toUpperCase().trim();

            if (!key) {
                alert('Veuillez entrer une clé d\'accès');
                return;
            }

            // Vérifier si c'est l'admin
            if (key === 'ADMIN') {
                showAdminPassword();
                return;
            }

            // Valider format élève (1 lettre + 3 chiffres)
            const keyRegex = /^[A-Z]\d{3}$/;
            if (!keyRegex.test(key)) {
                alert('Format invalide. Utilisez A123 pour élève ou ADMIN pour administrateur');
                return;
            }

            db.ref('students').orderByChild('key').equalTo(key).once('value', snapshot => {
                if (snapshot.exists()) {
                    const data = Object.entries(snapshot.val())[0];
                    currentUser = { id: data[0], key: key, name: data[1].name, ...data[1], role: 'student' };
                    isAdmin = false;
                    saveSession();
                    loadData();
                    showMainApp();
                } else {
                    alert('Clé d\'accès invalide');
                }
            });
        }

            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">

            document.body.appendChild(modal);

        function verifyAdminPassword() {
            const password = document.getElementById('adminPassInput').value;
            if (password === adminPassword) {

            currentUser = null;

        function updateAdminPassword() {
            const oldPass = document.getElementById('oldPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            if (oldPass !== adminPassword) {
                alert('❌ Ancien mot de passe incorrect');
                return;
            }

            if (newPass.length < 4) {
                alert('❌ Le mot de passe doit contenir au moins 4 caractères');
                return;
            }

            if (newPass !== confirmPass) {
                alert('❌ Les mots de passe ne correspondent pas');
                return;
            }

            adminPassword = newPass;
            localStorage.setItem('pmbf_adminPassword', newPass);
            alert('✅ Mot de passe mis à jour avec succès');
            document.querySelector('.modal.active').remove();
        }

        // Render Navigation Tabs
        let currentSectionLabels = [];

        function renderTabs() {
            const navTabs = document.getElementById('navTabs');
            navTabs.innerHTML = '';
            const sections = isAdmin ? 
                ['Élèves', 'Budgets', 'Caisse', 'Dons', 'Partenaires', 'Paramètres'] :
                ['Tableau de Bord', 'Caisse Personnelle', 'Dons', 'Partenaires'];
            currentSectionLabels = sections;

            sections.forEach((section, index) => {
                const btn = document.createElement('button');
                const isNew = (section === 'Budgets' && countNew('budgets') > 0) || (section === 'Dons' && countNew('dons') > 0);
                btn.innerHTML = section + (isNew ? ' <span style="background:#dc3545; color:white; border-radius:50%; padding:2px 6px; font-size:10px; margin-left:4px;">•</span>' : '');
                btn.className = index === 0 ? 'active' : '';
                btn.onclick = () => switchSection(index, section);
                navTabs.appendChild(btn);
            });

            renderSections();
            renderNotifBanner();
        }

        function switchSection(index, label) {
            document.querySelectorAll('.nav-tabs button').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.section').forEach((sec, i) => {
                sec.classList.toggle('active', i === index);
            });
            if (label === 'Budgets') markSeen('budgets');
            if (label === 'Dons') markSeen('dons');
            const btn = document.querySelectorAll('.nav-tabs button')[index];
            if (btn) btn.innerHTML = label;
            renderNotifBanner();
        }

        // Notifications
        function getLastSeen(type) {
            return parseInt(localStorage.getItem('pmbf_lastSeen_' + type)) || 0;
        }

        function markSeen(type) {
            localStorage.setItem('pmbf_lastSeen_' + type, Date.now());
        }

        function countNew(type) {
            const lastSeen = getLastSeen(type);
            if (type === 'budgets') {
                return Object.values(budgets).filter(b => (b.timestamp || 0) > lastSeen).length;
            }
            if (type === 'dons') {
                return Object.values(donCampaigns).filter(c => (c.createdAt || 0) > lastSeen).length;
            }
            return 0;
        }

        function renderNotifBanner() {
            const banner = document.getElementById('notifBanner');
            if (!banner) return;
            const newBudgets = countNew('budgets');
            const newDons = countNew('dons');
            const msgs = [];
            if (newBudgets > 0) msgs.push(`${newBudgets} nouvo budget(s)`);
            if (newDons > 0) msgs.push(`${newDons} nouvo don(s)`);
            if (msgs.length > 0) {
                banner.innerHTML = `<div class="alert alert-info">🔔 ${msgs.join(' • ')}</div>`;
            } else {
                banner.innerHTML = '';
            }
        }

                                                <td>${s.name}</td>
                                                <td><input type="checkbox" ${paid ? 'checked' : ''} onchange="toggleDonPayment('${id}', '${dateKey}', '${sid}', this.checked)"></td>
                                            </tr>`;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;

            // Partners Section
            sectionsDiv.innerHTML += `
                <div class="section">
                    <div class="card">
                        <h2>🔗 Lien du Copyright (Portfolio)</h2>
                        <div class="form-group">
                            <label>Lien vers votre portfolio</label>
                            <input type="url" id="devLinkInput" placeholder="https://..." value="${settings.devLink || ''}">
                        </div>
                        <button class="btn btn-primary" onclick="updateDevLink()">💾 Enregistrer</button>
                    </div>
                    <div class="card">
                        <h2>🤝 Gestion des Partenaires</h2>
                        <div class="form-group">
                            <label>Nom du Partenaire</label>
                            <input type="text" id="partnerName" placeholder="Ex: Service X">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="partnerDesc" placeholder="Description du partenaire"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Lien (URL)</label>
                            <input type="url" id="partnerLink" placeholder="https://...">
                        </div>
                        <div class="form-group">
                            <label>Image/Logo (URL)</label>
                            <input type="url" id="partnerImage" placeholder="https://...">
                        </div>
                        <button class="btn btn-success" onclick="addPartner()">➕ Ajouter Partenaire</button>
                    </div>
                    <div class="card">
                        <h3>Partenaires Actuels</h3>
                        <div class="partner-grid">
                            ${Object.entries(partners).map(([id, partner]) => `
                                <div class="partner-card">
                                    <div class="partner-image">${partner.emoji || '🏢'}</div>
                                    <div class="partner-info">
                                        <h4>${partner.name}</h4>
                                        <p style="font-size: 12px; color: #666;">${partner.description}</p>
                                        <button class="btn btn-danger" onclick="deletePartner('${id}')" style="padding: 5px 10px; font-size: 12px;">Supprimer</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            // Paramètres Section
            sectionsDiv.innerHTML += `
                <div class="section">
                    <div class="card">
                        <h2>⚙️ Paramètres du Système</h2>
                        <div class="form-group">
                            <label>🔍 Niveau de Zoom (${settings.zoomLevel || 100}%)</label>
                            <input type="range" id="zoomLevelInput" min="70" max="130" step="5" value="${settings.zoomLevel || 100}" oninput="document.getElementById('zoomLevelLabel').textContent = this.value + '%'" style="width: 100%;">
                            <div id="zoomLevelLabel" style="text-align: center; font-weight: 600; color: #1a73e8;">${settings.zoomLevel || 100}%</div>
                        </div>
                        <div class="form-group">
                            <label>🎨 Couleur du Texte</label>
                            <input type="color" id="textColorInput" value="${settings.textColor || '#333333'}" style="width: 100%; height: 45px; border: 2px solid #e0e0e0; border-radius: 8px;">
                        </div>
                        <div class="form-group">
                            <label>🖼️ Couleur de Fond</label>
                            <input type="color" id="bgColorInput" value="${settings.bgColor || '#667eea'}" style="width: 100%; height: 45px; border: 2px solid #e0e0e0; border-radius: 8px;">
                        </div>
                        <button class="btn btn-success" onclick="updateSystemSettings()">💾 Enregistrer</button>
                        <button class="btn btn-secondary" onclick="resetSystemSettings()" style="margin-left: 10px;">↺ Réinitialiser</button>
                    </div>
                </div>
            `;

            ImgLinkConverter.attachInline('budgetImage');
            ImgLinkConverter.attachInline('partnerImage');
        }

        function addStudent() {
            const name = document.getElementById('studentName').value;
            const email = document.getElementById('studentEmail').value;

            if (!name || !email) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            const key = generateKey();
            db.ref('students').push({ name, email, key }).then(() => {
                alert(`✅ Élève ajouté avec la clé: ${key}`);
                document.getElementById('studentName').value = '';
                document.getElementById('studentEmail').value = '';
            });
        }

        function generateKey() {
            const letter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            const numbers = String(Math.floor(Math.random() * 900) + 100);
            return letter + numbers;
        }

        function deleteStudent(id) {
            if (confirm('Êtes-vous sûr?')) {
                db.ref('students/' + id).remove();
            }
        }

        function showEditStudentModal(id) {
            const student = students[id];
            if (!student) return;
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="modal-close" onclick="this.parentElement.parentElement.remove()">✕</span>
                    <h2>✏️ Modifier l'Élève</h2>
                    <div class="form-group">
                        <label>Nom Complet</label>
                        <input type="text" id="editStudentName" value="${student.name || ''}">
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editStudentEmail" value="${student.email || ''}">
                    </div>
                    <div class="form-group">
                        <label>Clé d'Accès</label>
                        <input type="text" id="editStudentKey" value="${student.key || ''}" style="text-transform: uppercase;">
                    </div>
                    <button class="btn btn-success" onclick="updateStudent('${id}')">💾 Enregistrer</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function updateStudent(id) {
            const name = document.getElementById('editStudentName').value;
            const email = document.getElementById('editStudentEmail').value;
            const key = document.getElementById('editStudentKey').value.toUpperCase().trim();

            if (!name || !key) {
                alert('Veuillez remplir tous les champs obligatoires');
                return;
            }

            db.ref('students/' + id).update({ name, email, key }).then(() => {
                alert('✅ Élève mis à jour');
                document.querySelector('.modal.active').remove();
            });
        }

        // Budgets
        function updateBudgetPreview(inputId, previewId) {
            const total = parseFloat(document.getElementById(inputId).value) || 0;
            const count = Object.keys(students).length || 1;
            const per = Math.ceil(total / count);
            document.getElementById(previewId).textContent = `👉 ${count} élève(s) × ${per}G chacun = ${per * count}G`;
        }

        function addBudget() {
            const title = document.getElementById('budgetTitle').value;
            const desc = document.getElementById('budgetDesc').value;
            const totalAmount = parseFloat(document.getElementById('budgetTotalAmount').value);
            const image = document.getElementById('budgetImage').value;

            if (!title || !totalAmount) {
                alert('Veuillez remplir les champs obligatoires');
                return;
            }

            const count = Object.keys(students).length || 1;
            const amount = Math.ceil(totalAmount / count);

            db.ref('budgets').push({ title, description: desc, totalAmount, amount, imageUrl: image, timestamp: Date.now() }).then(() => {
                alert('✅ Budget créé');
                document.getElementById('budgetTitle').value = '';
                document.getElementById('budgetDesc').value = '';
                document.getElementById('budgetTotalAmount').value = '';
                document.getElementById('budgetImage').value = '';
                document.getElementById('budgetPreview').textContent = '';
            });
        }

        function showEditBudgetModal(id) {
            const budget = budgets[id];
            if (!budget) return;
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="modal-close" onclick="this.parentElement.parentElement.remove()">✕</span>
                    <h2>✏️ Modifier le Budget</h2>
                    <div class="form-group">
                        <label>Titre du Budget</label>
                        <input type="text" id="editBudgetTitle" value="${budget.title || ''}">
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="editBudgetDesc">${budget.description || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Montant Total du Budget (Gourdes)</label>
                        <input type="number" id="editBudgetTotalAmount" value="${budget.totalAmount || ''}" oninput="updateBudgetPreview('editBudgetTotalAmount', 'editBudgetPreview')">
                    </div>
                    <div id="editBudgetPreview" style="font-size: 13px; color: #1a73e8; font-weight: 600; margin-bottom: 15px;"></div>
                    <div class="form-group">
                        <label>Lien Image (URL)</label>
                        <input type="url" id="editBudgetImage" value="${budget.imageUrl || ''}">
                    </div>
                    <button class="btn btn-success" onclick="updateBudget('${id}')">💾 Enregistrer</button>
                </div>
            `;
            document.body.appendChild(modal);
            updateBudgetPreview('editBudgetTotalAmount', 'editBudgetPreview');
            ImgLinkConverter.attachInline('editBudgetImage');
        }

        function updateBudget(id) {
            const title = document.getElementById('editBudgetTitle').value;
            const desc = document.getElementById('editBudgetDesc').value;
            const totalAmount = parseFloat(document.getElementById('editBudgetTotalAmount').value);
            const image = document.getElementById('editBudgetImage').value;

            if (!title || !totalAmount) {
                alert('Veuillez remplir les champs obligatoires');
                return;
            }

            const count = Object.keys(students).length || 1;
            const amount = Math.ceil(totalAmount / count);

            db.ref('budgets/' + id).update({ title, description: desc, totalAmount, amount, imageUrl: image }).then(() => {
                alert('✅ Budget mis à jour');
                document.querySelector('.modal.active').remove();
            });
        }

        function deleteBudget(id) {
            if (confirm('Êtes-vous sûr?')) {
                db.ref('budgets/' + id).remove();
                db.ref('budgetPayments/' + id).remove();
            }
        }

        function showBudgetPaymentsModal(budgetId) {
            const budget = budgets[budgetId];
            if (!budget) return;
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="modal-close" onclick="this.parentElement.parentElement.remove()">✕</span>
                    <h2>💵 Paiements — ${budget.title}</h2>
                    <table class="table">
                        <thead><tr><th>Élève</th><th>Déjà payé</th><th>Ajouter</th></tr></thead>
                        <tbody>
                            ${Object.entries(students).map(([sid, s]) => {
                                const paid = (budgetPayments[budgetId] && budgetPayments[budgetId][sid]) || 0;
                                return `
                                <tr>
                                    <td>${s.name}</td>
                                    <td>${paid}G / ${budget.amount}G</td>
                                    <td>
                                        <input type="number" id="pay_${sid}" placeholder="Montant" style="width: 90px; display:inline-block;">
                                        <button class="btn btn-success" onclick="addBudgetPayment('${budgetId}', '${sid}')" style="padding: 5px 10px; font-size: 12px;">➕</button>
                                    </td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function addBudgetPayment(budgetId, studentId) {
            const input = document.getElementById('pay_' + studentId);
            const amount = parseFloat(input.value);
            if (!amount || amount <= 0) {
                alert('Veuillez entrer un montant valide');
                return;
            }
            const ref = db.ref('budgetPayments/' + budgetId + '/' + studentId);
            ref.once('value').then(snap => {
                const current = snap.val() || 0;
                ref.set(current + amount).then(() => {
                    document.querySelector('.modal.active').remove();
                    showBudgetPaymentsModal(budgetId);
                });
            });
        }

        function showBudgetDetail(budgetId) {
            const budget = budgets[budgetId];
            if (!budget) return;
            const paid = (budgetPayments[budgetId] && budgetPayments[budgetId][currentUser.id]) || 0;
            const reste = Math.max(0, budget.amount - paid);
            alert(`${budget.title}\n\nMontant demandé: ${budget.amount}G\nDéjà payé: ${paid}G\nReste à payer: ${reste}G`);
        }

        // Caisse Personnelle
        function showDepositModal(studentId, studentName) {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="modal-close" onclick="this.parentElement.parentElement.remove()">✕</span>
                    <h2>💰 Dépôt — ${studentName}</h2>
                    <div class="form-group">
                        <label>Montant (Gourdes)</label>
                        <input type="number" id="depositAmount" placeholder="500">
                    </div>
                    <button class="btn btn-success" onclick="makeDeposit('${studentId}')">✅ Déposer</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function makeDeposit(studentId) {
            const amount = parseFloat(document.getElementById('depositAmount').value);
            if (!amount || amount <= 0) {
                alert('Veuillez entrer un montant valide');
                return;
            }
            db.ref('cashBox').push({
                studentId,
                type: 'depot',
                amount,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now()
            }).then(() => {
                alert('✅ Dépôt enregistré');
                document.querySelector('.modal.active').remove();
            });
        }

        function requestWithdrawal() {
            const amount = parseFloat(document.getElementById('withdrawAmount').value);
            const description = document.getElementById('withdrawDesc').value;

            if (!amount || amount <= 0 || !description) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            db.ref('cashBox').push({
                studentId: currentUser.id,
                type: 'retrait',
                amount,
                description,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now(),
                status: 'pending'
            }).then(() => {
                alert('✅ Demande de retrait envoyée. En attente de validation.');
                document.getElementById('withdrawAmount').value = '';
                document.getElementById('withdrawDesc').value = '';
            });
        }

        function approveWithdrawal(id) {
            db.ref('cashBox/' + id).update({ status: 'approuve' });
        }

        function rejectWithdrawal(id) {
            db.ref('cashBox/' + id).update({ status: 'refuse' });
        }

        function statusLabel(status) {
            if (status === 'approuve') return '✅ Validé';
            if (status === 'refuse') return '❌ Refusé';
            return '⏳ En attente';
        }

        // Dons
        function getCampaignPeriods(camp) {
            const periods = [];
            const start = new Date(camp.startDate || camp.createdAt || Date.now());
            start.setHours(0, 0, 0, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const interval = parseInt(camp.intervalDays) || 7;
            let cursor = new Date(start);
            let safety = 0;
            while (cursor <= today && safety < 1000) {
                periods.push(cursor.toISOString().split('T')[0]);
                cursor.setDate(cursor.getDate() + interval);
                safety++;
            }
            if (periods.length === 0) {
                periods.push(start.toISOString().split('T')[0]);
            }
            return periods;
        }

        function getCurrentPeriodKey(camp) {
            const periods = getCampaignPeriods(camp);
            return periods[periods.length - 1];
        }

        function getUnpaidDonsForStudent(studentId) {
            const unpaid = [];
            Object.entries(donCampaigns).forEach(([id, camp]) => {
                const periods = getCampaignPeriods(camp);
                const missed = periods.filter(p => !(donPayments[id] && donPayments[id][p] && donPayments[id][p][studentId]));
                if (missed.length > 0) {
                    unpaid.push({ id, amount: camp.amount, intervalDays: camp.intervalDays, count: missed.length, total: missed.length * camp.amount });
                }
            });
            return unpaid;
        }

        function addDonCampaign() {
            const amount = parseFloat(document.getElementById('donAmount').value);
            const intervalDays = parseInt(document.getElementById('donInterval').value);

            if (!amount || !intervalDays) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            db.ref('donCampaigns').push({
                amount,
                intervalDays,
                startDate: new Date().toISOString().split('T')[0],
                createdAt: Date.now()
            }).then(() => {
                alert('✅ Don programmé');
                document.getElementById('donAmount').value = '';
                document.getElementById('donInterval').value = '';
            });
        }

        function deleteDonCampaign(id) {
            if (confirm('Êtes-vous sûr?')) {
                db.ref('donCampaigns/' + id).remove();
                db.ref('donPayments/' + id).remove();
            }
        }

        function toggleDonPayment(campaignId, dateKey, studentId, checked) {
            const ref = db.ref('donPayments/' + campaignId + '/' + dateKey + '/' + studentId);
            if (checked) {
                ref.set(true);
            } else {
                ref.remove();
            }
        }

        // Partners
        function updateDevLink() {
            const link = document.getElementById('devLinkInput').value;
            db.ref('settings').update({ devLink: link }).then(() => {
                alert('✅ Lien mis à jour');
            });
        }

        function addPartner() {
            const name = document.getElementById('partnerName').value;
            const desc = document.getElementById('partnerDesc').value;
            const link = document.getElementById('partnerLink').value;
            const image = document.getElementById('partnerImage').value;

            if (!name || !link) {
                alert('Veuillez remplir tous les champs');
                return;
            }

            db.ref('partners').push({ name, description: desc, link, imageUrl: image }).then(() => {
                alert('✅ Partenaire ajouté');
                document.getElementById('partnerName').value = '';
                document.getElementById('partnerDesc').value = '';
                document.getElementById('partnerLink').value = '';
                document.getElementById('partnerImage').value = '';
            });
        }

        function deletePartner(id) {
            if (confirm('Êtes-vous sûr?')) {
                db.ref('partners/' + id).remove();
            }
        }

        // Helper Functions
        function calculateStudentBalance(studentId) {
            return Object.values(cashBox).reduce((sum, m) => {
                if (m.studentId !== studentId) return sum;
                if (m.type === 'depot') return sum + parseFloat(m.amount || 0);
                if (m.type === 'retrait' && m.status === 'approuve') return sum - parseFloat(m.amount || 0);
                return sum;
            }, 0);
        }

        function calculateCashBoxTotal() {
            return Object.values(cashBox).reduce((sum, m) => {
                if (m.type === 'depot') return sum + parseFloat(m.amount || 0);
                if (m.type === 'retrait' && m.status === 'approuve') return sum - parseFloat(m.amount || 0);
                return sum;
            }, 0);
        }

        function calculatePaidStudents() {
            return new Set(Object.values(cashBox).filter(m => m.type === 'depot').map(m => m.studentId)).size;
        }

        function updateUI() {
            if (currentUser) {
                renderSections();
                renderNotifBanner();
            }
        }
    </script>
</body>
</html>
