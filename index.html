<head>

    <title>PMBF - Financement Classe</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .app-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            color: #1a73e8;
            font-size: 28px;
        }

        .user-info {
            font-size: 14px;
            color: #666;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .nav-tabs button {
            padding: 12px 24px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-tabs button.active {
            background: #1a73e8;
            color: white;
            border-color: #1a73e8;
        }

        .nav-tabs button:hover {
            border-color: #1a73e8;
        }

        .section {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .budget-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .budget-card:hover {
            transform: translateY(-4px);
        }

        .budget-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 48px;
        }

        .budget-content {
            padding: 15px;
        }

        .budget-content h3 {
            color: #1a73e8;
            margin-bottom: 8px;
        }

        .budget-content p {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }

        .amount {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #1a73e8;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .btn-primary {
            background: #1a73e8;
            color: white;
        }

        .btn-primary:hover {
            background: #1557b0;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            display: block;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-box h3 {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-box .value {
            font-size: 28px;
            font-weight: bold;
            color: #1a73e8;
        }

        .partner-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .partner-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .partner-card:hover {
            transform: translateY(-4px);
        }

        .partner-image {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
        }

        .partner-info {
            padding: 15px;
        }

        .partner-info h4 {
            color: #1a73e8;
            margin-bottom: 8px;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .alert-info {
            background: #e7f3ff;
            color: #004085;
            border: 1px solid #b3d9ff;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .login-container h1 {
            color: #1a73e8;
            margin-bottom: 30px;
            text-align: center;
        }

        .login-container .form-group input {
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 2px;
            text-align: center;
        }

        .key-input {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .key-input input {
            flex: 1;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            text-transform: uppercase;
            text-align: center;
        }

        .key-input input:first-child {
            max-width: 50px;
        }

        .install-prompt {
            background: #fff3cd;
            border: 1px solid #ffeeba;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .install-prompt.show {
            display: block;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-close {
            float: right;
            font-size: 24px;
            cursor: pointer;
            color: #999;
        }

        .modal-close:hover {
            color: #333;
        }

        @media (max-width: 768px) {
            .grid {
                grid-template-columns: 1fr;
            }

            .partner-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .nav-tabs {
                gap: 5px;
            }

            .nav-tabs button {
                padding: 10px 15px;
                font-size: 12px;
            }

            .app-container {
                padding: 10px;
            }

            .table th,
            .table td {
                padding: 8px;
                font-size: 13px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 13px;
            }
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #1a73e8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Roulette Wheel */
        .wheel-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .wheel-outer {
            position: relative;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, #cfd4da 0%, #8b93a1 60%, #4a5261 100%);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            padding: 14px;
        }

        .wheel-leds {
            position: absolute;
            inset: 0;
        }

        .wheel-led {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFD700, #b8860b);
            box-shadow: 0 0 6px 2px rgba(255, 215, 0, 0.8);
            animation: ledBlink 1.4s infinite alternate;
        }

        @keyframes ledBlink {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .wheel-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0B1E3D;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-slice-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 42px;
            height: 42px;
            margin: -21px 0 0 -21px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            text-align: center;
        }

        .wheel-slice-icon img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .wheel-pointer {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 26px solid #b8bec7;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
            z-index: 5;
        }

        .wheel-center-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle, #FFE066 0%, #FFD700 60%, #b8860b 100%);
            border: 3px solid #0B1E3D;
            color: white;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            z-index: 6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .wheel-center-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .wheel-result-card {
            text-align: center;
            padding: 20px;
        }

        .wheel-result-card img {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 10px;
        }

        /* Chat */
        .chat-card {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #eee;
            margin-bottom: 10px;
        }

        .chat-header-name {
            font-weight: 700;
            font-size: 16px;
            color: #0B1E3D;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .chat-bubble-me {
            align-self: flex-end;
            background: linear-gradient(135deg, #1a73e8, #4a90e2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .chat-bubble-them {
            align-self: flex-start;
            background: #f1f3f5;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .chat-bubble-sender {
            font-size: 11px;
            font-weight: 700;
            opacity: 0.75;
            margin-bottom: 2px;
        }

        .chat-bubble-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
            text-align: right;
        }

        .chat-input-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .chat-input-row input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        .chat-input-row button {
            border-radius: 50%;
            width: 42px;
            height: 42px;
            padding: 0;
            font-size: 16px;
            flex-shrink: 0;
        }

        .chat-friend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 4px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .chat-friend-row:hover {
            background: #f8f9fa;
        }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0B1E3D, #1a73e8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }

        .chat-request-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
        }
    </style>
    <script>
        // Service Worker Registration et Notifications
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('push', event => {
                    const data = event.data ? event.data.json() : {};
                    const options = {
                        body: data.body || 'Notification de PMBF',
                        icon: 'data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%271a73e8%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%27100%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27>P</text></svg>',
                        badge: 'data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%271a73e8%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%27100%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27>P</text></svg>',
                        tag: data.tag || 'pmbf-notification',
                        requireInteraction: false
                    };
                    self.registration.showNotification(data.title || 'PMBF', options);
                });

                self.addEventListener('notificationclick', event => {
                    event.notification.close();
                    event.waitUntil(
                        clients.matchAll({type: 'window'}).then(clientList => {
                            for (let i = 0; i < clientList.length; i++) {
                                if (clientList[i].url == '/' && 'focus' in clientList[i])
                                    return clientList[i].focus();
                            }
                            if (clients.openWindow)
                                return clients.openWindow('/');
                        })
                    );
                });
            `;
            
            const blob = new Blob([swCode], {type: 'application/javascript'});
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(err => {
                console.log('Service Worker pa ka rejistore:', err);
            });
        }

        // Request notification permission
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission().then(permission => {
                    if (permission === 'granted') {
                        console.log('✅ Notification permission granted');
                    }
                });
            }
        }

        // Send notification
        function sendNotification(title, options = {}) {
            if ('Notification' in window && Notification.permission === 'granted') {
                const defaultOptions = {
                    icon: 'data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%271a73e8%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%27100%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27>P</text></svg>',
                    badge: 'data:image/svg+xml,<svg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27><rect fill=%271a73e8%27 width=%27192%27 height=%27192%27/><text x=%2796%27 y=%27120%27 font-size=%27100%27 font-weight=%27bold%27 fill=%27white%27 text-anchor=%27middle%27>P</text></svg>',
                    tag: 'pmbf-notification',
                    ...options
                };
                new Notification(title, defaultOptions);
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            requestNotificationPermission();
        });
    </script>
</head>
<body>

    <!-- Service Worker Registration & Offline Indicator -->
    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            const swCode = `
const CACHE_NAME = 'pmbf-cache-v1';
const urlsToCache = [
    '/',
    '/index.html',
    '/manifest.json'
];

self.addEventListener('install', event => {
    event.waitUntil(
        caches.open(CACHE_NAME).then(cache => {
            return cache.addAll(urlsToCache).catch(() => {
                console.log('Cache addAll failed, some resources may be offline');
            });
        })
    );
    self.skipWaiting();
});

self.addEventListener('activate', event => {
    event.waitUntil(
        caches.keys().then(cacheNames => {
            return Promise.all(
                cacheNames.map(cacheName => {
                    if (cacheName !== CACHE_NAME) {
                        return caches.delete(cacheName);
                    }
                })
            );
        })
    );
    self.clients.claim();
});

self.addEventListener('fetch', event => {
    if (event.request.method !== 'GET') {
        return;
    }

    event.respondWith(
        caches.match(event.request).then(response => {
            if (response) {
                return response;
            }

            return fetch(event.request).then(response => {
                if (!response || response.status !== 200 || response.type === 'error') {
                    return response;
                }

                const responseToCache = response.clone();
                caches.open(CACHE_NAME).then(cache => {
                    cache.put(event.request, responseToCache);
                });

                return response;
            }).catch(() => {
                return caches.match('/index.html');
            });
        })
    );
});

    <script>
        const ImgLinkConverter = (function () {
            const IMGBB_API_KEY = '808b99f038e8855c6e93a124bd09cc6b';

            const LABELS = {
                convertBtn: '📷 Konvèti Foto',
                badFile: '❌ Chwazi yon foto.',
                tooBig: '❌ Foto twò gwo (maks 10 Mo).',
                converting: '⏳ Ap konvèti...',
                done: '✅ Konvèti!',
                failed: '❌ Pa mache, eseye ankò.',
                batchEmpty: 'Poko gen lyen',
                copied: '📋 Kopye!'
            };

            async function uploadToImgbb(file) {
                const fd = new FormData();
                fd.append('image', file);
                const resp = await fetch('https://api.imgbb.com/1/upload?key=' + encodeURIComponent(IMGBB_API_KEY), { method: 'POST', body: fd });
                const json = await resp.json();
                if (!resp.ok || !json || !json.success || !json.data) {
                    throw new Error((json && json.error && json.error.message) || ('HTTP ' + resp.status));
                }
                return json.data.display_url || json.data.url;
            }

            async function uploadToCatbox(file) {
                const fd = new FormData();
                fd.append('reqtype', 'fileupload');
                fd.append('fileToUpload', file);
                const resp = await fetch('https://catbox.moe/user/api.php', { method: 'POST', body: fd });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const url = (await resp.text()).trim();
                if (!/^https?:\/\//i.test(url)) throw new Error(url || 'echwe');
                return url;
            }

            async function convertImageToLink(file) {
                let url = null;
                if (IMGBB_API_KEY) { try { url = await uploadToImgbb(file); } catch (e) { /* eseye plan B */ } }
                if (!url) { try { url = await uploadToCatbox(file); } catch (e) { /* tou de echwe */ } }
                return url;
            }

            function attachInline(inputId) {
                const input = document.getElementById(inputId);
                if (!input || input.dataset.ilAttached) return;
                input.dataset.ilAttached = '1';

                const wrap = document.createElement('div');
                wrap.className = 'img-link-inline';
                wrap.innerHTML =
                    '<img class="il-preview" id="ilprev_' + inputId + '">' +
                    '<label class="il-btn" for="ilfile_' + inputId + '">' + LABELS.convertBtn + '</label>' +
                    '<input type="file" id="ilfile_' + inputId + '" accept="image/*" style="display:none;">' +
                    '<span class="il-status" id="ilstatus_' + inputId + '"></span>';
                input.insertAdjacentElement('afterend', wrap);

                document.getElementById('ilfile_' + inputId).addEventListener('change', function () {
                    handleInlineUpload(this, inputId);
                });

                if (input.value) {
                    const p = document.getElementById('ilprev_' + inputId);
                    p.src = input.value;
                    p.style.display = 'inline-block';
                }
            }

            async function handleInlineUpload(fileInput, targetInputId) {
                const file = fileInput.files[0];
                if (!file) return;
                const status = document.getElementById('ilstatus_' + targetInputId);
                const preview = document.getElementById('ilprev_' + targetInputId);
                const target = document.getElementById(targetInputId);

                if (!file.type || !file.type.startsWith('image/')) { status.textContent = LABELS.badFile; return; }
                if (file.size > 10 * 1024 * 1024) { status.textContent = LABELS.tooBig; return; }

                status.textContent = LABELS.converting;
                const url = await convertImageToLink(file);

                if (url) {
                    target.value = url;
                    target.dispatchEvent(new Event('input', { bubbles: true }));
                    target.dispatchEvent(new Event('change', { bubbles: true }));
                    preview.src = url;
                    preview.style.display = 'inline-block';
                    status.textContent = LABELS.done;

                    // Auto-copier le lien
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(url).catch(() => {});
                    }

                    setTimeout(() => { if (status) status.textContent = ''; }, 2500);
                } else {
                    status.textContent = LABELS.failed;
                }
                fileInput.value = '';
            }

            return {
                IMGBB_API_KEY,
                LABELS,
                convertImageToLink,
                attachInline
            };
        })();
    </script>

        // Dons
        function getCampaignPeriods(camp) {
            const periods = [];
            const start = new Date(camp.startDate || camp.createdAt || Date.now());
            start.setHours(0, 0, 0, 0);
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const interval = parseInt(camp.intervalDays) || 7;
            let cursor = new Date(start);
            let safety = 0;
            while (cursor <= today && safety < 1000) {
                periods.push(cursor.toISOString().split('T')[0]);
                cursor.setDate(cursor.getDate() + interval);
                safety++;
            }
            if (periods.length === 0) {
                periods.push(start.toISOString().split('T')[0]);
            }
            return periods;
        }

        function getCurrentPeriodKey(camp) {
            const periods = getCampaignPeriods(camp);
            return periods[periods.length - 1];
        }

        function getUnpaidDonsForStudent(studentId) {

            Object.entries(donCampaigns).forEach(([id, camp]) => {
                const periods = getCampaignPeriods(camp);
                const missed = periods.filter(p => !(donPayments[id] && donPayments[id][p] && donPayments[id][p][studentId]));
                if (missed.length > 0) {
                    unpaid.push({ id, amount: camp.amount, intervalDays: camp.intervalDays, count: missed.length, total: missed.length * camp.amount });
                }
            });
            return unpaid;
        }

        function calculateStudentBalance(studentId) {
            return Object.values(cashBox).reduce((sum, m) => {
                if (m.studentId !== studentId) return sum;
                if (m.type === 'depot') return sum + parseFloat(m.amount || 0);
                if (m.type === 'retrait' && m.status === 'approuve') return sum - parseFloat(m.amount || 0);
                return sum;
            }, 0);
        }

        function calculateCashBoxTotal() {
            return Object.values(cashBox).reduce((sum, m) => {
                if (m.type === 'depot') return sum + parseFloat(m.amount || 0);
                if (m.type === 'retrait' && m.status === 'approuve') return sum - parseFloat(m.amount || 0);
                return sum;
            }, 0);
        }

        function calculateClassCaisseTotal() {
            // Total des dons payés
            let donTotal = 0;
            Object.entries(donPayments).forEach(([campaignId, campaigns]) => {
                const campaign = donCampaigns[campaignId];
                if (campaign && campaign.amount) {
                    Object.values(campaigns).forEach(dateKey => {
                        const count = Object.keys(dateKey).length;
                        donTotal += count * campaign.amount;
                    });
                }
            });

            // Ajouter les budgets marqués comme includeInClassCaisse
            let budgetTotal = 0;
            Object.entries(budgets).forEach(([budgetId, budget]) => {
                if (budget.includeInClassCaisse) {
                    // Compter l'argent collecté pour ce budget
                    const collectedAmount = Object.values(budgetPayments).reduce((sum, payment) => {
                        if (payment.budgetId === budgetId) {
                            return sum + parseFloat(payment.amount || 0);
                        }
                        return sum;
                    }, 0);
                    budgetTotal += collectedAmount;
                }
            });

            // Soustraire les dépenses
            const expenses = Object.values(classExpenses).reduce((sum, expense) => {
                return sum + parseFloat(expense.amount || 0);
            }, 0);

            return donTotal + budgetTotal - expenses;
        }

        function calculatePaidStudents() {
            return new Set(Object.values(cashBox).filter(m => m.type === 'depot').map(m => m.studentId)).size;
        }

        // ===== Roulette / Wheel =====
        function getWheelPeriodInfo(camp) {
            if (!camp || !camp.active || !camp.anchorAt || !camp.intervalDays) return null;
            const intervalMs = camp.intervalDays * 24 * 60 * 60 * 1000;
            const now = Date.now();
            if (now < camp.anchorAt) return null;
            const elapsed = now - camp.anchorAt;
            const periodIndex = Math.floor(elapsed / intervalMs);
            const periodStart = camp.anchorAt + periodIndex * intervalMs;
            const periodEnd = periodStart + intervalMs;
            return {
                periodKey: 'p' + periodIndex,
                periodStart,
                periodEnd,
                isActive: now < periodEnd
            };
        }

        function getMySpinsForPeriod(studentId, campId, periodKey) {
            return Object.entries(wheelSpins)
                .filter(([id, s]) => s.studentId === studentId && s.campId === campId && s.periodKey === periodKey)
                .map(([id, s]) => ({ id, ...s }));
        }

        function renderWheelSectionForStudent() {
            const activeCamps = Object.entries(wheelCampaigns).filter(([campId, camp]) => {
                const info = getWheelPeriodInfo(camp);
                return info && info.isActive;
            });

            if (activeCamps.length === 0) {
                return '<p style="text-align:center; color:#666; padding: 30px 0;">🎡 Pa gen roulette ki aktif kounye a. Tann pwochèn siprann!</p>';
            }

            return activeCamps.map(([campId, camp]) => {
                const info = getWheelPeriodInfo(camp);
                const mySpins = getMySpinsForPeriod(currentUser.id, campId, info.periodKey);
                const maxSpins = camp.maxSpins || 1;
                const remaining = Math.max(0, maxSpins - mySpins.length);
                const body = remaining > 0 ?
                    renderWheelWidget(campId, wheelSlices[campId] || {}) :
                    mySpins.map(s => renderWheelResult(s)).join('<hr>');
                return `
                    <div class="card" style="background: #f8f9fa; margin-bottom: 15px;">
                        <h3>${camp.name}</h3>
                        <p style="font-size: 13px; color: #666;">Vire ki rete: ${remaining}/${maxSpins}</p>
                        ${body}
                    </div>
                `;
            }).join('');
        }

        function renderWheelWidget(campId, slicesObj) {
            const slices = Object.entries(slicesObj);
            if (slices.length === 0) {
                return '<p style="color:#999; text-align:center;">Pa gen tranch configuré.</p>';
            }
            const n = slices.length;
            const anglePer = 360 / n;
            const radius = 92;

            const leds = Array.from({ length: 20 }).map((_, i) => {
                const angle = (360 / 20) * i;
                const rad = (angle * Math.PI) / 180;
                const x = 140 + 130 * Math.sin(rad) - 4;
                const y = 140 - 130 * Math.cos(rad) - 4;
                return `<div class="wheel-led" style="left:${x}px; top:${y}px; animation-delay:${(i % 5) * 0.2}s;"></div>`;
            }).join('');

            const gradientStops = slices.map(([id, s], i) => {
                const color = i % 2 === 0 ? '#0B1E3D' : '#FFD700';
                return `${color} ${i * anglePer}deg ${(i + 1) * anglePer}deg`;
            }).join(', ');

            const icons = slices.map(([id, s], i) => {
                const mid = i * anglePer + anglePer / 2;
                const icon = s.type === 'photo' && s.imageUrl ? `<img src="${s.imageUrl}" alt="">` :
                    s.type === 'parole' ? '💬' : '❌';
                return `
                    <div class="wheel-slice-icon" style="transform: rotate(${mid}deg) translate(0, -${radius}px) rotate(${-mid}deg);">
                        ${icon}
                    </div>
                `;
            }).join('');

            return `
                <div class="wheel-wrap">
                    <div class="wheel-outer">
                        <div class="wheel-leds">${leds}</div>
                        <div class="wheel-pointer"></div>
                        <div class="wheel-inner" id="wheelInner_${campId}" style="background: conic-gradient(${gradientStops});">
                            ${icons}
                        </div>
                        <button class="wheel-center-btn" id="wheelSpinBtn_${campId}" onclick="spinWheel('${campId}')">TOURNEZ</button>
                    </div>
                    <p style="margin-top: 15px; color: #666; font-size: 13px;">Klike sou TOURNEZ pou eseye chans ou! 🎉</p>
                </div>
            `;
        }

        function difficultyText(chance) {
            if (chance <= 20) return 'Trè Difisil';
            if (chance <= 40) return 'Difisil';
            if (chance <= 60) return 'Mwayen';
            if (chance <= 80) return 'Fasil';
            return 'Trè Fasil';
        }

        function updateDifficultyLabel(inputId, labelId) {
            const val = parseInt(document.getElementById(inputId).value);
            document.getElementById(labelId).textContent = `${val}% (${difficultyText(val)})`;
        }

        function pickWinningIndex(slices, winChance) {
            const photoIdx = [];
            const otherIdx = [];
            slices.forEach(([id, s], i) => {
                if (s.type === 'photo') photoIdx.push(i);
                else otherIdx.push(i);
            });

            const roll = Math.random() * 100;
            let pool;
            if (roll < winChance && photoIdx.length > 0) {
                pool = photoIdx;
            } else if (otherIdx.length > 0) {
                pool = otherIdx;
            } else {
                pool = photoIdx;
            }
            return pool[Math.floor(Math.random() * pool.length)];
        }

        function spinWheel(campId) {
            const btn = document.getElementById('wheelSpinBtn_' + campId);
            const wheelInner = document.getElementById('wheelInner_' + campId);
            if (!btn || !wheelInner || btn.disabled) return;

            const slices = Object.entries(wheelSlices[campId] || {});
            if (slices.length === 0) {
                alert('Pa gen tranch configuré pou roulette sa a.');
                return;
            }

            const camp = wheelCampaigns[campId] || {};
            const winChance = camp.winChance != null ? camp.winChance : 30;

            btn.disabled = true;
            const idx = pickWinningIndex(slices, winChance);
            const [sliceId, slice] = slices[idx];
            const anglePer = 360 / slices.length;
            const targetMid = idx * anglePer + anglePer / 2;
            const fullSpins = 6;
            const finalRotation = fullSpins * 360 + (360 - targetMid);

            wheelInner.style.transform = `rotate(${finalRotation}deg)`;

            setTimeout(() => {
                recordSpinResult(campId, sliceId, slice);
            }, 4100);
        }

        function recordSpinResult(campId, sliceId, slice) {
            const camp = wheelCampaigns[campId];

            db.ref('wheelSpins').push({
                campId,
                studentId: currentUser.id,
                periodKey: info.periodKey,
                sliceId,
                type: slice.type,
                imageUrl: slice.imageUrl || '',
                text: slice.text || '',
                timestamp: Date.now()

        }

            const entry = Object.entries(friendRequests).find(([id, r]) =>
                (r.fromId === currentUser.id && r.toId === otherId) ||
                (r.fromId === otherId && r.toId === currentUser.id)
            );
            return entry ? { id: entry[0], ...entry[1] } : null;
        }

        function getMyFriends() {
            return Object.entries(friendRequests)
                .filter(([id, r]) => r.status === 'accepted' && (r.fromId === currentUser.id || r.toId === currentUser.id))
                .map(([id, r]) => {
                    const otherId = r.fromId === currentUser.id ? r.toId : r.fromId;
                    const otherName = r.fromId === currentUser.id ? r.toName : r.fromName;
                    return { id: otherId, name: otherName };
                });
        }

        function getPendingRequests(direction) {
            return Object.entries(friendRequests)
                .filter(([id, r]) => r.status === 'pending' && (direction === 'received' ? r.toId === currentUser.id : r.fromId === currentUser.id))
                .map(([id, r]) => ({ id, ...r }));
        }

        function sendFriendRequest(toId, toName) {
            db.ref('friendRequests').push({
                fromId: currentUser.id,
                fromName: currentUser.name,
                toId,
                toName,
                status: 'pending',
                timestamp: Date.now()
            });
        }

        function acceptFriendRequest(reqId) {
            db.ref('friendRequests/' + reqId).update({ status: 'accepted' });
        }

        function declineFriendRequest(reqId) {
            db.ref('friendRequests/' + reqId).remove();
        }

        function openChat(id, name) {
            activeChatWith = { id, name };
            updateUI();
            setTimeout(scrollChatToBottom, 100);
        }

        function closeChat() {
            activeChatWith = null;
            updateUI();
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input) return;
            const text = input.value.trim();
            if (!text || !activeChatWith) return;
            const chatId = getChatId(currentUser.id, activeChatWith.id);
            db.ref('chats/' + chatId + '/messages').push({
                fromId: currentUser.id,
                fromName: currentUser.name,
                text,
                timestamp: Date.now()
            });
            input.value = '';
        }

        function scrollChatToBottom() {
            const box = document.getElementById('chatMessagesBox');
            if (box) box.scrollTop = box.scrollHeight;
        }

        function renderChatSection() {
            if (activeChatWith) {
                return renderChatConversation(activeChatWith);
            }
            return renderChatHome();
        }

        function renderChatHome() {
            const received = getPendingRequests('received');
            const sent = getPendingRequests('sent');
            const friends = getMyFriends();
            const friendIds = new Set(friends.map(f => f.id));
            const others = getAllUsers().filter(u => u.id !== currentUser.id && !friendIds.has(u.id) && !getFriendStatus(u.id));

            return `
                <h2>💬 Chat</h2>
                ${received.length > 0 ? `
                    <h3 style="margin-top: 15px;">🔔 Demandes Reçues</h3>
                    ${received.map(r => `
                        <div class="chat-request-row">
                            <div class="chat-avatar">${initials(r.fromName)}</div>
                            <span style="flex:1;">${r.fromName}</span>
                            <button class="btn btn-success" onclick="acceptFriendRequest('${r.id}')" style="padding: 5px 10px; font-size: 12px;">✅</button>
                            <button class="btn btn-danger" onclick="declineFriendRequest('${r.id}')" style="padding: 5px 10px; font-size: 12px;">❌</button>
                        </div>
                    `).join('')}
                ` : ''}
                ${sent.length > 0 ? `
                    <h3 style="margin-top: 15px;">📤 Demandes Envoyées</h3>
                    ${sent.map(r => `
                        <div class="chat-request-row">
                            <div class="chat-avatar">${initials(r.toName)}</div>
                            <span style="flex:1;">${r.toName}</span>
                            <span style="color:#999; font-size: 12px;">⏳ En attente</span>
                            <button class="btn btn-secondary" onclick="declineFriendRequest('${r.id}')" style="padding: 5px 10px; font-size: 12px;">Annuler</button>
                        </div>
                    `).join('')}
                ` : ''}
                <h3 style="margin-top: 15px;">👥 Mes Amis (${friends.length})</h3>
                ${friends.length === 0 ? '<p style="color:#999; font-size: 13px;">Poko gen zanmi. Ajoute yon moun anba a!</p>' : friends.map(f => `
                    <div class="chat-friend-row" onclick="openChat('${f.id}', '${(f.name || '').replace(/'/g, "\\'")}')">
                        <div class="chat-avatar">${initials(f.name)}</div>
                        <span style="flex:1;">${f.name}</span>
                        <span style="color:#1a73e8;">›</span>
                    </div>
                `).join('')}
                <h3 style="margin-top: 15px;">➕ Ajouter un Ami</h3>
                ${others.length === 0 ? '<p style="color:#999; font-size: 13px;">Pa gen lòt moun disponib.</p>' : others.map(u => `
                    <div class="chat-friend-row">
                        <div class="chat-avatar">${initials(u.name)}</div>
                        <span style="flex:1;">${u.name}</span>
                        <button class="btn btn-primary" onclick="sendFriendRequest('${u.id}', '${(u.name || '').replace(/'/g, "\\'")}')" style="padding: 5px 10px; font-size: 12px;">➕ Ajouter</button>
                    </div>
                `).join('')}
            `;
        }

        function renderChatConversation(other) {
            const chatId = getChatId(currentUser.id, other.id);
            const msgs = Object.values((chats[chatId] && chats[chatId].messages) || {}).sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

            return `
                <div class="chat-card">
                    <div class="chat-header">
                        <button class="btn btn-secondary" onclick="closeChat()" style="padding: 6px 10px; font-size: 12px;">← Retour</button>
                        <div class="chat-avatar">${initials(other.name)}</div>
                        <span class="chat-header-name">${other.name}</span>
                    </div>
                    <div class="chat-messages" id="chatMessagesBox">
                        ${msgs.length === 0 ? '<p style="text-align:center; color:#999; margin-top:30px;">Kòmanse chat la... 👋</p>' : msgs.map(m => `
                            <div class="chat-bubble ${m.fromId === currentUser.id ? 'chat-bubble-me' : 'chat-bubble-them'}">
                                ${m.fromId !== currentUser.id ? `<div class="chat-bubble-sender">${m.fromName}</div>` : ''}
                                <div>${escapeHtml(m.text)}</div>
                                <div class="chat-bubble-time">${new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="chatInput" placeholder="Ekri yon mesaj..." onkeypress="if(event.key==='Enter'){sendChatMessage();}">
                        <button class="btn btn-primary" onclick="sendChatMessage()">➤</button>
                    </div>
                </div>
            `;
        }

        // ===== AKTIVITÉ FUNCTIONS =====
        function addActivity() {
            const type = document.getElementById('activityType').value;
            const where = document.getElementById('activityWhere').value;
            const book = document.getElementById('activityBook').value;
            const page = document.getElementById('activityPage').value;
            const support = document.getElementById('activitySupport').value;
            const dueDate = document.getElementById('activityDueDate').value;
            const teacher = document.getElementById('activityTeacher').value;
            const exercises = document.getElementById('activityExercises').value;
            const notes = document.getElementById('activityNotes').value;

            if (!type || !where || !dueDate || !teacher) {
                alert('Tanpri, ranpli tout jaden obligatwa yo (Type, Kote, Dat Limit, Nòm Professeur)!');
                return;
            }

            const activityData = {
                type,
                where,
                book,
                page,
                support,
                dueDate,
                teacher,
                exercises,
                notes,
                createdAt: Date.now(),
                completed: []
            };

            db.ref('activities').push(activityData).then(() => {
                // Clear form
                document.getElementById('activityType').value = '';
                document.getElementById('activityWhere').value = '';
                document.getElementById('activityBook').value = '';
                document.getElementById('activityPage').value = '';
                document.getElementById('activitySupport').value = '';
                document.getElementById('activityDueDate').value = '';
                document.getElementById('activityTeacher').value = '';
                document.getElementById('activityExercises').value = '';
                document.getElementById('activityNotes').value = '';
                alert('Aktivite a te ajoute avèk siksè!');
                
                // Send notification
                const typeLabels = {
                    'devoir-individuel': 'Devoir Individuel',
                    'devoir-groupe': 'Devoir en Groupe',
                    'lecon': 'Leçon à Étudier',
                    'expose-individuel': 'Exposé Individuelle',
                    'expose-groupe': 'Exposé en Groupe'
                };
                const typeEmojis = {
                    'devoir-individuel': '📝',
                    'devoir-groupe': '👥📝',
                    'lecon': '📖',
                    'expose-individuel': '🎤',
                    'expose-groupe': '👥🎤'
                };
                const typeLabel = typeLabels[type] || type;
                const typeEmoji = typeEmojis[type] || '📌';
                
                sendNotification(`${typeEmoji} Nouvo Aktivite!`, {
                    body: `${typeLabel}\nProfesseur: ${teacher}\nDat Limit: ${new Date(dueDate).toLocaleDateString('ht-HT')}`,
                    tag: 'activity-' + Date.now()
                });
                
                updateUI();
            }).catch(err => {
                console.error('Erè kand ajoute aktivite:', err);
                alert('Erè: ' + err.message);
            });
        }

        function renderStudentActivities() {
            const actList = Object.entries(activities).sort((a, b) => new Date(a[1].dueDate) - new Date(b[1].dueDate));
            
            if (actList.length === 0) {
                return '<p style="color: #999;">Pa gen aktivite pou yo fè pou kounye a...</p>';
            }

            const typeEmojis = {
                'devoir-individuel': '📝',
                'devoir-groupe': '👥📝',
                'lecon': '📖',
                'expose-individuel': '🎤',
                'expose-groupe': '👥🎤'
            };

            const typeLabels = {
                'devoir-individuel': 'Devoir Individuel',
                'devoir-groupe': 'Devoir en Groupe',
                'lecon': 'Leçon à Étudier',
                'expose-individuel': 'Exposé Individuelle',
                'expose-groupe': 'Exposé en Groupe'
            };

            return `
                ${actList.map(([id, act]) => {
                    const typeEmoji = typeEmojis[act.type] || '📌';
                    const typeLabel = typeLabels[act.type] || act.type;
                    const dueDate = new Date(act.dueDate);
                    const today = new Date();
                    const isOverdue = dueDate < today;
                    const daysUntil = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                    const dueDateStr = dueDate.toLocaleDateString('ht-HT');
                    const supportLabel = {
                        'cahier': 'Nan Cahie',
                        'ouvrage': 'Nan Ouvraj Ba',
                        'feuille': 'Nan Fèy Blanche'
                    }[act.support] || act.support;

                    return `
                        <div class="card" style="background: ${isOverdue ? '#fff3cd' : '#f8f9fa'}; border-left: 4px solid ${isOverdue ? '#dc3545' : '#28a745'}; margin-bottom: 15px;">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div style="flex: 1;">
                                    <h3 style="margin: 0 0 8px 0; color: #1a73e8;">${typeEmoji} ${typeLabel}</h3>
                                    <p style="margin: 5px 0; font-size: 14px;"><strong>Kote:</strong> ${act.where}</p>
                                    ${act.book ? `<p style="margin: 5px 0; font-size: 14px;"><strong>Ouvraj:</strong> ${act.book}${act.page ? ' - Paj ' + act.page : ''}</p>` : ''}
                                    ${act.exercises ? `<p style="margin: 5px 0; font-size: 14px;"><strong>Egzèsis:</strong> ${act.exercises}</p>` : ''}
                                    <p style="margin: 5px 0; font-size: 14px;"><strong>Sipò:</strong> ${supportLabel}</p>
                                    <p style="margin: 5px 0; font-size: 14px;"><strong>Professeur:</strong> ${act.teacher}</p>
                                    ${act.notes ? `<p style="margin: 8px 0; font-size: 13px; background: white; padding: 8px; border-radius: 4px;"><strong>Nòt:</strong> ${act.notes}</p>` : ''}
                                </div>
                                <div style="text-align: right; margin-left: 15px;">
                                    <div style="font-size: 14px; font-weight: bold; ${isOverdue ? 'color: #dc3545;' : 'color: #28a745;'}">
                                        ${isOverdue ? '⚠️ Pase dat' : (daysUntil <= 2 ? '⏰ ' + daysUntil + ' jou res' : '📅 ' + dueDateStr)}
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('')}
            `;
        }

        function renderActivitiesList() {
            const actList = Object.entries(activities).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
            
            if (actList.length === 0) {
                return '<p style="color: #999;">Pa gen aktivite ankò...</p>';
            }

            const typeEmojis = {
                'devoir-individuel': '📝',
                'devoir-groupe': '👥📝',
                'lecon': '📖',
                'expose-individuel': '🎤',
                'expose-groupe': '👥🎤'
            };

            const typeLabels = {
                'devoir-individuel': 'Devoir Individuel',
                'devoir-groupe': 'Devoir en Groupe',
                'lecon': 'Leçon à Étudier',
                'expose-individuel': 'Exposé Individuelle',
                'expose-groupe': 'Exposé en Groupe'
            };

            return `
                <table class="table" style="font-size: 13px;">
                    <thead>
                        <tr>
                            <th>Tip</th>
                            <th>Detay</th>
                            <th>Liv</th>
                            <th>Exs</th>
                            <th>Sipò</th>
                            <th>Dat Limit</th>
                            <th>Professeur</th>
                            <th>Aksyon</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${actList.map(([id, act]) => {
                            const typeEmoji = typeEmojis[act.type] || '📌';
                            const typeLabel = typeLabels[act.type] || act.type;
                            const dueDate = new Date(act.dueDate).toLocaleDateString('ht-HT');
                            const isOverdue = new Date(act.dueDate) < new Date();
                            const supportLabel = {
                                'cahier': 'Cahie',
                                'ouvrage': 'Ouvraj',
                                'feuille': 'Fèy'
                            }[act.support] || act.support;

                            return `
                                <tr style="border-bottom: 1px solid #eee; ${isOverdue ? 'background-color: #fff3cd;' : ''}">
                                    <td><strong>${typeEmoji} ${typeLabel}</strong></td>
                                    <td>${act.where}</td>
                                    <td>${act.book || '-'} ${act.page ? '(p. ' + act.page + ')' : ''}</td>
                                    <td>${act.exercises || '-'}</td>
                                    <td>${supportLabel}</td>
                                    <td><strong>${dueDate}</strong> ${isOverdue ? '⚠️' : ''}</td>
                                    <td>${act.teacher}</td>
                                    <td>
                                        <button class="btn btn-primary" onclick="editActivity('${id}')" style="padding: 4px 8px; font-size: 11px;">✏️</button>
                                        <button class="btn btn-danger" onclick="deleteActivity('${id}')" style="padding: 4px 8px; font-size: 11px;">🗑️</button>
                                    </td>
                                </tr>
                                ${act.notes ? `<tr style="background-color: #f5f5f5;"><td colspan="8" style="padding: 8px; font-size: 12px; color: #666;"><strong>Nòt:</strong> ${act.notes}</td></tr>` : ''}
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function editActivity(activityId) {
            const activity = activities[activityId];
            if (!activity) return;

            // Populate form with activity data
            document.getElementById('activityType').value = activity.type;
            document.getElementById('activityWhere').value = activity.where;
            document.getElementById('activityBook').value = activity.book || '';
            document.getElementById('activityPage').value = activity.page || '';
            document.getElementById('activitySupport').value = activity.support || '';
            document.getElementById('activityDueDate').value = activity.dueDate;
            document.getElementById('activityTeacher').value = activity.teacher || '';
            document.getElementById('activityExercises').value = activity.exercises || '';
            document.getElementById('activityNotes').value = activity.notes || '';

            // Change button text
            const btn = document.querySelector('[onclick="addActivity()"]');
            if (btn) {
                btn.textContent = '✏️ Mete Jou Aktivite';
                btn.onclick = () => updateActivity(activityId);
            }

            // Scroll to form
            document.getElementById('activityType').scrollIntoView({ behavior: 'smooth' });
        }

        function updateActivity(activityId) {
            const type = document.getElementById('activityType').value;
            const where = document.getElementById('activityWhere').value;
            const book = document.getElementById('activityBook').value;
            const page = document.getElementById('activityPage').value;
            const support = document.getElementById('activitySupport').value;
            const dueDate = document.getElementById('activityDueDate').value;
            const teacher = document.getElementById('activityTeacher').value;
            const exercises = document.getElementById('activityExercises').value;
            const notes = document.getElementById('activityNotes').value;

            const updates = {
                type, where, book, page, support, dueDate, 
                teacher, exercises, notes
            };

            db.ref('activities/' + activityId).update(updates).then(() => {
                alert('Aktivite a te mete jou!');
                // Reset form
                document.getElementById('activityType').value = '';
                document.getElementById('activityWhere').value = '';
                document.getElementById('activityBook').value = '';
                document.getElementById('activityPage').value = '';
                document.getElementById('activitySupport').value = '';
                document.getElementById('activityDueDate').value = '';
                document.getElementById('activityTeacher').value = '';
                document.getElementById('activityExercises').value = '';
                document.getElementById('activityNotes').value = '';
                const btn = document.querySelector('[onclick*="updateActivity"]');
                if (btn) {
                    btn.textContent = '➕ Ajoute Aktivite';
                    btn.onclick = () => addActivity();
                }
                updateUI();
            });
        }

        function deleteActivity(activityId) {
            if (confirm('Ou asire w vle efase aktivite sa a?')) {
                db.ref('activities/' + activityId).remove().then(() => {
                    alert('Aktivite a te efase!');
                    updateUI();
                });
            }
        }

        function updateUI() {
            if (currentUser) {
                renderSections();
                applyActiveSection();
                renderNotifBanner();
                scrollChatToBottom();
            }
        }
    </script>
</body>
</html>
